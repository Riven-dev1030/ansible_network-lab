# ISC DHCP Server Configuration for ZTP with OOB Management
# 此配置支持 Zero Touch Provisioning 與 DHCP 靜態綁定

# 全局設定
default-lease-time 600;
max-lease-time 7200;
authoritative;

# DNS 設定（可選）
option domain-name "lab.local";
option domain-name-servers 8.8.8.8, 8.8.4.4;

# ZTP 相關選項
# Option 66: TFTP Server Name
# Option 67: Bootfile Name
# Option 150: TFTP Server Address (Cisco specific)

# ============================================
# OOB 管理網段: 192.168.1.0/24
# ============================================
subnet 192.168.1.0 netmask 255.255.255.0 {
    # 動態 IP 池（用於初始 ZTP 階段）
    range 192.168.1.200 192.168.1.250;

    # 預設閘道
    option routers 192.168.1.1;

    # ZTP Server 設定
    option tftp-server-name "192.168.1.100";        # TFTP Server
    option bootfile-name "ztp_bootstrap.py";        # 初始 ZTP 腳本

    # Cisco 特定選項
    option option-150 code 150 = ip-address;
    option option-150 192.168.1.100;

    # ============================================
    # 靜態 DHCP 綁定（由 ZTP 自動註冊後生成）
    # ============================================

    # HQ Routers
    host R1 {
        hardware ethernet 50:00:00:01:00:00;
        fixed-address 192.168.1.11;
        option host-name "R1";
        # 指定此設備的 ZTP 配置文件
        option bootfile-name "configs/R1-config.py";
    }

    host R2 {
        hardware ethernet 50:00:00:02:00:00;
        fixed-address 192.168.1.12;
        option host-name "R2";
        option bootfile-name "configs/R2-config.py";
    }

    host R3 {
        hardware ethernet 50:00:00:03:00:00;
        fixed-address 192.168.1.13;
        option host-name "R3";
        option bootfile-name "configs/R3-config.py";
    }

    # HQ Switches
    host SW1 {
        hardware ethernet 50:00:00:11:00:00;
        fixed-address 192.168.1.21;
        option host-name "SW1";
        option bootfile-name "configs/SW1-config.py";
    }

    # Branch Devices
    host BR1 {
        hardware ethernet 50:00:00:04:00:00;
        fixed-address 192.168.1.14;
        option host-name "BR1";
        option bootfile-name "configs/BR1-config.py";
    }

    host BR-SW {
        hardware ethernet 50:00:00:12:00:00;
        fixed-address 192.168.1.22;
        option host-name "BR-SW";
        option bootfile-name "configs/BR-SW-config.py";
    }

    # ISP Routers
    host ISP1 {
        hardware ethernet 50:00:00:31:00:00;
        fixed-address 192.168.1.31;
        option host-name "ISP1";
        option bootfile-name "configs/ISP1-config.py";
    }

    host ISP2 {
        hardware ethernet 50:00:00:32:00:00;
        fixed-address 192.168.1.32;
        option host-name "ISP2";
        option bootfile-name "configs/ISP2-config.py";
    }
}

# ============================================
# 日誌設定
# ============================================
log-facility local7;

# ============================================
# 動態 DNS 更新（可選）
# ============================================
# ddns-update-style interim;
# ignore client-updates;
