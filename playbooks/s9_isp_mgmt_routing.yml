---
# S9 | ISP 管理網路路由配置
# 目標: 配置 ISP 路由器透過管理網路 (mg) 的流量路由
# 架構: mg_sw1 和 mg_sw19 為純 L2 交換機，透過 R1/R2 作為網關

- name: 配置 ISP 路由器管理網路路由
  hosts: isp
  gather_facts: no
  vars:
    # 管理網路配置 (純 L2 架構)
    mgmt_network: "192.168.1.0 255.255.255.0"

    # 使用 R1/R2 作為網關 (它們有管理網路介面和內部網路連接)
    mgmt_gateway:
      ISP1: "192.168.1.11"  # 透過 R1 作為網關
      ISP2: "192.168.1.12"  # 透過 R2 作為網關

    # ISP 管理介面配置
    mgmt_interfaces:
      ISP1:
        interface: "GigabitEthernet0/2"
        ip: "192.168.1.31"
        netmask: "255.255.255.0"
        description: "Management Network - via mg_sw1 (L2)"
      ISP2:
        interface: "GigabitEthernet0/2"
        ip: "192.168.1.32"
        netmask: "255.255.255.0"
        description: "Management Network - via mg_sw19 (L2)"

  tasks:
    - name: 配置 ISP 管理網路介面
      cisco.ios.ios_config:
        lines:
          - interface {{ mgmt_interfaces[inventory_hostname].interface }}
          - description "{{ mgmt_interfaces[inventory_hostname].description }}"
          - ip address {{ mgmt_interfaces[inventory_hostname].ip }} {{ mgmt_interfaces[inventory_hostname].netmask }}
          - no shutdown

    - name: 配置到內部網路的靜態路由 (透過管理網路)
      cisco.ios.ios_config:
        lines:
          # 到 HQ 內部網路的路由
          - ip route 10.10.0.0 255.255.0.0 {{ mgmt_gateway[inventory_hostname] }} 250
          # 到分公司網路的路由
          - ip route 10.110.0.0 255.255.0.0 {{ mgmt_gateway[inventory_hostname] }} 250
        save_when: modified

    - name: 配置管理網路的存取控制 (可選 - 增強安全性)
      cisco.ios.ios_config:
        lines:
          - ip access-list standard MGMT_ACCESS
          - permit 192.168.1.0 0.0.0.255
          - permit 10.10.0.0 0.0.255.255
          - permit 10.110.0.0 0.0.255.255
          - deny any log
        save_when: modified

    - name: 套用存取控制到管理介面 (可選)
      cisco.ios.ios_config:
        lines:
          - interface {{ mgmt_interfaces[inventory_hostname].interface }}
          - ip access-group MGMT_ACCESS in

    - name: 配置策略路由 (可選 - 用於特定流量透過管理網路)
      cisco.ios.ios_config:
        lines:
          - route-map MGMT_ROUTE permit 10
          - match ip address MGMT_TRAFFIC
          - set ip next-hop {{ mgmt_gateway[inventory_hostname] }}
        save_when: modified
      when: false  # 預設關閉，需要時設定為 true

- name: 驗證 ISP 管理網路路由配置
  hosts: isp
  gather_facts: no
  tasks:
    - name: 檢查管理介面狀態
      cisco.ios.ios_command:
        commands:
          - show ip interface brief | include GigabitEthernet0/2
      register: mgmt_interface_status

    - name: 檢查路由表
      cisco.ios.ios_command:
        commands:
          - show ip route | include 10.10.0.0|10.110.0.0|192.168.1.0
      register: route_table

    - name: 檢查存取控制列表
      cisco.ios.ios_command:
        commands:
          - show ip access-lists MGMT_ACCESS
      register: acl_status
      ignore_errors: yes

    - name: 測試到管理網關的連通性
      cisco.ios.ios_command:
        commands:
          - ping {{ mgmt_gateway[inventory_hostname] }} repeat 5
      register: ping_gateway

    - name: 顯示驗證結果
      debug:
        msg:
          - "=== {{ inventory_hostname }} 管理網路配置驗證 ==="
          - ""
          - "管理介面狀態:"
          - "{{ mgmt_interface_status.stdout_lines }}"
          - ""
          - "路由表 (管理和內部網路):"
          - "{{ route_table.stdout_lines }}"
          - ""
          - "存取控制列表:"
          - "{{ acl_status.stdout_lines | default(['未配置']) }}"
          - ""
          - "管理網關連通性測試:"
          - "{{ ping_gateway.stdout_lines }}"

- name: 配置 HQ 路由器的管理網路介面和路由
  hosts: hq_routers
  gather_facts: no
  vars:
    # R1 和 R2 的管理網路介面配置
    r_mgmt_interfaces:
      R1:
        interface: "GigabitEthernet0/3"
        ip: "192.168.1.11"
        description: "Management Network Interface"
      R2:
        interface: "GigabitEthernet0/3"
        ip: "192.168.1.12"
        description: "Management Network Interface"
  tasks:
    - name: 配置 R1/R2 管理網路介面
      cisco.ios.ios_config:
        lines:
          - interface {{ r_mgmt_interfaces[inventory_hostname].interface }}
          - description "{{ r_mgmt_interfaces[inventory_hostname].description }}"
          - ip address {{ r_mgmt_interfaces[inventory_hostname].ip }} 255.255.255.0
          - no shutdown
      when: inventory_hostname in ['R1', 'R2']

    - name: 配置 R1/R2 上的 Proxy ARP (讓管理網路可以透過此介面路由)
      cisco.ios.ios_config:
        lines:
          - interface {{ r_mgmt_interfaces[inventory_hostname].interface }}
          - ip proxy-arp
      when: inventory_hostname in ['R1', 'R2']
      ignore_errors: yes

    - name: 驗證管理網路介面配置
      cisco.ios.ios_command:
        commands:
          - show ip interface brief | include {{ r_mgmt_interfaces[inventory_hostname].interface }}
      register: mgmt_interface
      when: inventory_hostname in ['R1', 'R2']

    - name: 驗證路由表
      cisco.ios.ios_command:
        commands:
          - show ip route connected
      register: mgmt_route
      when: inventory_hostname in ['R1', 'R2']

    - name: 顯示配置資訊
      debug:
        msg:
          - "{{ inventory_hostname }} 管理網路介面狀態:"
          - "{{ mgmt_interface.stdout_lines }}"
          - ""
          - "連接的網路:"
          - "{{ mgmt_route.stdout_lines }}"
      when: inventory_hostname in ['R1', 'R2']
