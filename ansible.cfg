[defaults]
# Ansible 配置文件

# Inventory 位置
inventory = ./inventory/hosts.yml

# 角色路徑
roles_path = ./roles

# 主機密鑰檢查 (實驗室環境可關閉)
host_key_checking = False

# 日誌文件
log_path = ./ansible.log

# 輸出格式
stdout_callback = yaml
bin_ansible_callbacks = True

# 並發數
forks = 8

# 超時設定
timeout = 60

# 重試文件
retry_files_enabled = False

# Gathering facts (網路設備通常不需要)
gathering = explicit

# 顯示跳過的任務
display_skipped_hosts = False

# 錯誤處理
any_errors_fatal = False

[inventory]
# Inventory 插件
enable_plugins = yaml, ini

[privilege_escalation]
# 權限提升 (用於 Cisco enable 模式)
become = True
become_method = enable
become_user = admin

[persistent_connection]
# 持久連接設定 (網路設備)
connect_timeout = 60
command_timeout = 60

[ssh_connection]
# SSH 連接設定
#ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o KexAlgorithms=+diffie-hellman-group-exchange-sha1,diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa
ssh_args = -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/docker-bastion_key -p 2222 -o StrictHostKeyChecking=no root@192.168.213.31" -o KexAlgorithms=+diffie-hellman-group-exchange-sha1,diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o StrictHostKeyChecking=no -o ControlMaster=auto -o ControlPersist=60s
pipelining = True

# Jump Host / Bastion 設定
#bastion_host = 192.168.213.136
#bastion_user = root
#bastion_password = eve
